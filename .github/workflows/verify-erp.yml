name: Test ERP and publish output
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/TEST_RESULTS.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run all automated tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v tests | tee test-output.txt
      - name: Run real application demo with fictional records
        id: demo
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/demo.py | tee demo-output.txt
      - name: Add output to GitHub job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## University ERP execution report"
            echo ""
            echo "- Automated tests: ${{ steps.tests.outcome }}"
            echo "- Application demo: ${{ steps.demo.outcome }}"
            echo ""
            echo "### Automated test output"
            echo '~~~text'
            if [[ -f test-output.txt ]]; then cat test-output.txt; else echo "No test output."; fi
            echo '~~~'
            echo "### Demo execution output"
            echo '~~~text'
            if [[ -f demo-output.txt ]]; then cat demo-output.txt; else echo "No demo output."; fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish results into repository
        if: always()
        shell: bash
        run: |
          mkdir -p docs
          {
            echo "# University ERP — latest automated execution"
            echo ""
            echo "**Source:** GitHub Actions run [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "**Automated test step:** ${{ steps.tests.outcome }}"
            echo ""
            echo "**Application demo step:** ${{ steps.demo.outcome }}"
            echo ""
            echo "## Pytest output"
            echo '~~~text'
            if [[ -f test-output.txt ]]; then cat test-output.txt; else echo "No test output."; fi
            echo '~~~'
            echo ""
            echo "## Demo application output"
            echo '~~~text'
            if [[ -f demo-output.txt ]]; then cat demo-output.txt; else echo "No demo output."; fi
            echo '~~~'
            echo ""
            echo "These checks run against temporary fictional records, not real student data."
          } > docs/TEST_RESULTS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TEST_RESULTS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish ERP test and demo execution output"
            git push
          fi
      - name: Fail workflow if checks failed
        if: steps.tests.outcome != 'success' || steps.demo.outcome != 'success'
        run: exit 1
